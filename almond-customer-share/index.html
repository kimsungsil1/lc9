setView([${d.lat},${d.lon}],12)"><td>${d.rank}</td><td>${d.sido} ${d.sigungu}<div class="bar"><span style="width:${Math.max(3,Math.round(d.ordered/max*100))}%"></span></div></td><td class="num">${fmt.format(d.ordered)}</td><td class="num">${fmt.format(d.zero)}</td><td class="num">${d.pen}%</td></tr>`).join('')}function renderSummary(){const s=DATA.summary;document.getElementById('summary').innerHTML=[['생활미용업 전체',fmt.format(s.business_total)],['고객 엑셀 행',fmt.format(s.customer_rows)],['주문고객 주소',fmt.format(s.ordered_locations)],['미주문 주소',fmt.format(s.zero_locations)],['전체 침투율',s.overall_penetration_pct+'%']].map(x=>`<div class="metric"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}document.getElementById('blue').onclick=e=>{showBlue=!showBlue;e.currentTarget.classList.toggle('active',showBlue);draw()};document.getElementById('red').onclick=e=>{showRed=!showRed;e.currentTarget.classList.toggle('active',showRed);draw()};const legend=L.control({position:'bottomright'});legend.onAdd=()=>{const div=L.DomUtil.create('div','legend');div.innerHTML='<b>표시 기준</b><br><span class="dot blueDot"></span>주문고객<br><span class="dot redDot"></span>미주문';return div};legend.addTo(map);renderSummary();renderTable();draw();</script></body></html>
